[project]
name = "codex-remote-control"
dynamic = ["version"]
description = "Steer a Codex session from claude.ai/code and the Claude apps, as a Claude Code Remote Control session"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aniket Chadalavada" }]
keywords = ["codex", "claude", "claude-code", "remote-control", "unofficial"]
dependencies = [
    "claude-rc-api @ git+https://github.com/ThatCrispyToast/claude-rc-api@5c9ae2fa2699fe4319b560a8b39835039acc61f0",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
codex-rc = "codex_remote_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "codex_remote_control/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["codex_remote_control"]

[tool.uv]
package = true
